[workspace]
resolver = "2"
members = [
    "proseql-engine",
    "proseql-formats",
    "proseql-storage",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
toml = "0.8"
serde_yaml = "0.9"
json5 = "1.0"
jsonc-parser = { version = "0.33", features = ["serde", "serde_json"] }
serde-hjson = "1.1"
toon-format = { version = "0.5", default-features = false }
globset = "0.4"
walkdir = "2"
tempfile = "3"
notify = "6"
unicode-ident = "1"
