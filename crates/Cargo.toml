[workspace]
resolver = "2"
members = [
    "proseql-engine",
    "proseql-formats",
    "proseql-native",
    "proseql-storage",
    "proseql-vcf",
    "proseql-wasm",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
toml = "0.8"
serde_yaml = "0.9"
json5 = "1.0"
jsonc-parser = { version = "0.33", features = ["serde", "serde_json"] }
serde-hjson = "1.1"
toon-format = { version = "0.5", default-features = false }
globset = "0.4"
walkdir = "2"
tempfile = "3"
notify = "6"
unicode-ident = "1"

# Optimized native benchmark with allocation-site symbols; no LTO changes.
[profile.memory-profile]
inherits = "release"
debug = 1

[profile.wasm-production]
inherits = "release"
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "unwind"
incremental = false

[profile.wasm-profile]
inherits = "release"
opt-level = 2
debug = 2
lto = "off"
codegen-units = 16
panic = "unwind"
incremental = false
