[package]
name = "proseql-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen boundary for the proseQL Rust engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
proseql-engine = { path = "../proseql-engine" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
