[package]
name = "proseql-engine"
version = "0.1.0"
edition = "2021"
description = "proseQL platform-blind engine: config descriptor, boundary value model, error taxonomy, and conformance harness"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
# Native opts into owned CRUD decoding; other hosts keep the existing path.
owned-mutations = []
native-checks = []
ecmascript-regex = ["native-checks", "dep:regress"]

[dependencies.regress]
version = "0.11"
optional = true
features = ["utf16"]
