pre-commit:
  parallel: true
  commands:
    format:
      glob: "**/*.ts"
      run: biome format --write {staged_files} && git add {staged_files}
    lint:
      glob: "**/*.ts"
      run: biome check {staged_files}

pre-push:
  commands:
    rebase:
      priority: 1
      run: git fetch origin main --quiet && git rebase origin/main --quiet
    typecheck:
      priority: 2
      run: bun x tsc --build
    test:
      priority: 2
      run: bun test packages/*/tests/
