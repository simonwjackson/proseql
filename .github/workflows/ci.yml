name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - run: nix develop --command bun install --frozen-lockfile --ignore-scripts
      - run: nix run .#workflow-lint
      - run: nix run .#typecheck
      - run: nix run .#lint

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: crates -> crates/target
      - run: nix develop --command bun install --frozen-lockfile --ignore-scripts
      - run: nix run .#build-release-artifacts
      - run: nix run .#test

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: crates -> crates/target
      - run: nix run .#rust-format-check
      - run: nix run .#rust-check
      - run: nix run .#rust-test
      - run: nix run .#rust-lint
      - run: nix run .#rust-wasm-check

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: crates -> crates/target
      - run: nix develop --command bun install --frozen-lockfile --ignore-scripts
      - run: nix run .#build-release-artifacts
      - run: nix run .#parity-gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: parity-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/effect/reports/corpus-report.json
            packages/effect/reports/examples-report.json

  wasm-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: crates -> crates/target
      - run: nix develop --command bun install --frozen-lockfile --ignore-scripts
      - run: nix run .#build-release-artifacts
      - run: nix develop --command bun run scripts/verify-packed-packages.ts --skip-build --output .artifacts/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wasm-package-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/engine/build/wasm-build-report.json
            packages/engine/dist/wasm/
            packages/engine/dist/browser-wasm/
            .artifacts/packages/tarballs/*.tgz

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: crates -> crates/target
      - run: nix develop --command bun install --frozen-lockfile --ignore-scripts
      - run: nix run .#build-release-artifacts
      - run: nix run .#browser-smoke
      - run: nix run .#browser-budget
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-wasm-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/engine/build/wasm-build-report.json
            .artifacts/browser/current.json
            .artifacts/browser/evidence.json

# Ordinary pushes and pull requests only run reversible checks. This workflow has
# no publication job, registry credential, push, tag, or GitHub release step.
