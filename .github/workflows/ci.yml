name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command bash -c "bun install && just typecheck && just test"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command bash -c "bun install && just typecheck"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command bash -c "bun install && just lint"

  release:
    needs: [test, typecheck, lint]
    if: "${{ github.event_name != 'pull_request' && !startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Release
        id: release
        env:
          LEFTHOOK: '0'
          GH_TOKEN: ${{ github.token }}
        run: |
          nix develop --command bash -c "bun install && bun run scripts/release.ts"
          echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: nix develop --command bash -c "bun install && bun run build:clean"
      - name: Resolve workspace references
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          for pkg in node rest cli; do
            sed -i "s/\"workspace:\*\"/\"^${CORE_VERSION}\"/" "packages/${pkg}/package.json"
          done
      - name: Fix package.json validation issues
        run: |
          for pkg in core node rest cli; do
            (cd "packages/${pkg}" && npm pkg fix)
          done
      - name: Verify package artifacts
        run: nix develop --command bash -c "bun run verify:packages"
      - name: Publish @proseql/core
        run: npm publish --provenance --access public --ignore-scripts
        working-directory: packages/core
      - name: Publish @proseql/node
        run: npm publish --provenance --access public --ignore-scripts
        working-directory: packages/node
      - name: Publish @proseql/rest
        run: npm publish --provenance --access public --ignore-scripts
        working-directory: packages/rest
      - name: Publish @proseql/cli
        run: npm publish --provenance --access public --ignore-scripts
        working-directory: packages/cli

  publish-gpr:
    needs: [release]
    if: "${{ vars.PUBLISH_GPR == 'true' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@proseql'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command bash -c "bun install && bun run build:clean"
      - name: Resolve workspace references
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          for pkg in node rest cli; do
            sed -i "s/\"workspace:\*\"/\"^${CORE_VERSION}\"/" "packages/${pkg}/package.json"
          done
      - name: Verify package artifacts
        run: nix develop --command bash -c "bun run verify:packages"
      - name: Publish @proseql/core
        run: npm publish --access public --ignore-scripts
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @proseql/node
        run: npm publish --access public --ignore-scripts
        working-directory: packages/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @proseql/rest
        run: npm publish --access public --ignore-scripts
        working-directory: packages/rest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish @proseql/cli
        run: npm publish --access public --ignore-scripts
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
